## Managed components. `idf.py build` fetches these into managed_components/.
##
## esp-modbus is pinned below 2.0 on purpose: the 2.x line replaced the
## mbc_master_* controller API used in app_modbus.c.
dependencies:
  idf:
    version: ">=5.1"
  espressif/esp32-camera:
    version: "^2.0.15"
  espressif/esp-modbus:
    version: "^1.0.15"
